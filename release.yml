name: Release & Container Publishing

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release-images:
    name: Build, Scan & Publish Release Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: 'restaurant-service', path: 'services/restaurant-service/Dockerfile' }
          - { name: 'order-service', path: 'services/order-service/Dockerfile' }
          - { name: 'delivery-service', path: 'services/delivery-service/Dockerfile' }
          - { name: 'frontend', path: 'frontend/Dockerfile' }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag Version
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${{ github.repository }}/${{ matrix.service.name }}" >> $GITHUB_OUTPUT

      - name: Build & Push Release Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
