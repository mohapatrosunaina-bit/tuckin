openapi: 3.0.3
info:
  title: Tuckin Food Delivery Platform API
  description: API specifications for Tuckin services (Restaurant, Order, and Delivery)
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Restaurant Service
  - url: http://localhost:3002
    description: Order Service
  - url: http://localhost:3003
    description: Delivery Service

paths:
  # Restaurant Service Endpoints
  /health/live:
    get:
      summary: Service liveness probe
      responses:
        '200':
          description: Service process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: live
                  service:
                    type: string

  /health/ready:
    get:
      summary: Service readiness probe
      responses:
        '200':
          description: Service is ready to receive traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  service:
                    type: string

  /api/restaurants:
    get:
      summary: List available restaurants
      responses:
        '200':
          description: List of restaurants
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'

  /api/restaurants/{restaurantId}:
    get:
      summary: Get details of a single restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Restaurant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/restaurants/{restaurantId}/menu:
    get:
      summary: Get menu items for a restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu items
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurantId:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'

  # Order Service Endpoints
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        '200':
          description: Prometheus metrics formatted text
          content:
            text/plain:
              schema:
                type: string

  /api/orders:
    get:
      summary: List recent orders
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
    post:
      summary: Place a new order
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - restaurantId
                - items
              properties:
                restaurantId:
                  type: string
                deliveryZone:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - menuItemId
                      - quantity
                    properties:
                      menuItemId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/orders/{orderId}:
    get:
      summary: Get order details by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/orders/{orderId}/status:
    patch:
      summary: Update order status
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  # Delivery Service Endpoints
  /api/delivery/{orderId}:
    get:
      summary: Get simulated delivery status and ETA for order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery tracking state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryTracking'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/delivery/{orderId}/simulate-next:
    post:
      summary: Progress order simulation step (demo/dev only)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery tracking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryTracking'

components:
  schemas:
    OrderStatus:
      type: string
      enum:
        - PLACED
        - ACCEPTED
        - PREPARING
        - PICKED_UP
        - OUT_FOR_DELIVERY
        - DELIVERED
        - CANCELLED

    Restaurant:
      type: object
      required:
        - id
        - name
        - deliveryZone
        - isOpen
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        deliveryZone:
          type: string
        isOpen:
          type: boolean

    MenuItem:
      type: object
      required:
        - id
        - restaurantId
        - name
        - pricePaise
        - available
      properties:
        id:
          type: string
        restaurantId:
          type: string
        name:
          type: string
        description:
          type: string
        pricePaise:
          type: integer
          description: Price in integer paise
        available:
          type: boolean

    OrderItem:
      type: object
      required:
        - menuItemId
        - name
        - quantity
        - unitPricePaise
        - lineTotalPaise
      properties:
        menuItemId:
          type: string
        name:
          type: string
        quantity:
          type: integer
        unitPricePaise:
          type: integer
        lineTotalPaise:
          type: integer

    Order:
      type: object
      required:
        - id
        - restaurantId
        - status
        - items
        - totalPaise
        - createdAt
      properties:
        id:
          type: string
        restaurantId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalPaise:
          type: integer
        deliveryZone:
          type: string
        estimatedDeliveryMinutes:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeliveryTracking:
      type: object
      required:
        - orderId
        - status
        - simulated
        - updatedAt
      properties:
        orderId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        estimatedDeliveryMinutes:
          type: integer
        simulated:
          type: boolean
        updatedAt:
          type: string
          format: date-time

  responses:
    ErrorResponse:
      description: Standardized error response
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - code
                  - message
                  - requestId
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
                  details:
                    type: object
