global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["order-service:3002", "localhost:3002"]

  - job_name: "restaurant-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["restaurant-service:3001", "localhost:3001"]

  - job_name: "delivery-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["delivery-service:3003", "localhost:3003"]
